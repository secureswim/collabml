<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CollabML{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">C</span>
      <span>CollabML</span>
      <span class="alpha">alpha</span>
    </a>
    {% block nav %}
    <form method="post" action="/logout"><button class="button ghost small">Log out</button></form>
    {% endblock %}
  </header>
  <main class="shell">
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
